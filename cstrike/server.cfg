//=====================================================
// SARC IFC BRUSQUE
// Counter-Strike 1.6 - Torneio 3x3
//=====================================================
hostname "SARC IFC Brusque - CS 1.6"
//
//==================== LAN ====================
//
sv_lan 1
sv_region 2
sv_password ""
sv_visiblemaxplayers 7
//
//================ ADMINISTRAÇÃO ==============
// ATENÇÃO: a documentação da imagem cajuclc/cstrike-docker afirma que um
// server.cfg customizado (como este, montado via volume) SOBRESCREVE a
// variável de ambiente RCON_PASSWORD do docker-compose.yml. Ou seja, a
// senha que realmente vale para o jogo é a linha abaixo — não a do .env.
// Se você mudar a senha, mude AQUI e também no .env (RCON_PASSWORD), para
// o backend continuar autenticando corretamente via RCON.
//
rcon_password "admin123"
//
//=============== CONFIGURAÇÃO DA PARTIDA =====
//
mp_friendlyfire 1
mp_autoteambalance 0
mp_limitteams 0
mp_forcecamera 2
mp_forcechasecam 2
mp_startmoney 800
mp_buytime 0.25
mp_c4timer 35
mp_freezetime 10
mp_roundtime 1.75
//
//================ BOTS =======================
// A imagem cajuclc/cstrike-docker roda um binário Linux que, na prática,
// não tem o ZBot nativo do engine (bot_quota/bot_quota_mode) funcionando —
// isso é uma limitação histórica comum de builds Linux do HLDS. Por isso
// usamos o PODBOT, que já vem incluído nessa imagem via Metamod (não
// depende do bot nativo do engine).
//
// pb_minbots 0 / pb_maxbots 6: o Podbot mantém até 6 bots preenchendo as
// vagas jogáveis (3x3), reduzindo a contagem sozinho conforme jogadores
// reais entram — a 7ª vaga (sv_visiblemaxplayers 7 / MAXPLAYERS=7) fica
// livre para espectador. O servidor já sobe com os bots preenchidos.
pb_minbots 0
pb_maxbots 6
pb_bot_quota_match 1
pb_autokill 0
pb_difficulty 1
pb_chat 0
// ZBot nativo e YaPB desativados para não conflitar com o Podbot (dois
// sistemas de bot preenchendo vagas ao mesmo tempo duplicaria o efeito).
bot_quota 0
bot_quota_mode "normal"
bot_join_after_player 0
yb_quota 0
yb_quota_mode "normal"
yb_join_after_player 0
yb_autovacate 0
//==================================================
// LIMITES DA PARTIDA E ROTAÇÃO
// mp_maxrounds 0 = sem limite automático de rounds. O corte em 6 rounds
// (3x3, com prorrogação se empatar) e a troca de lado (Half-Time) são
// controlados pelo backend do torneio (automaticamente via log, ou
// manualmente pelo operador na tela Live Match) — mas o servidor também
// funciona para jogo livre/testes mesmo sem o painel, já que não depende
// de nenhum comando externo para aceitar conexões.
//==================================================
mp_maxrounds 0
mp_timelimit 0
mp_winlimit 0
//
//================ FÍSICA =====================
//
sv_gravity 800
sv_maxspeed 320
sv_accelerate 5
sv_airaccelerate 10
sv_airmove 1
sv_friction 4
sv_stopspeed 75
//
//=============== PERFORMANCE LAN =============
//
sys_ticrate 1000
sv_maxrate 25000
sv_minrate 25000
sv_maxupdaterate 101
sv_minupdaterate 101
sv_maxcmdrate 101
sv_mincmdrate 101
//
//================ SEGURANÇA ==================
//
allow_spectators 1
pausable 0
sv_cheats 0
sv_aim 0
//
//================ LOGS =======================
//
log on
sv_logfile 1
sv_logecho 1
sv_log_onefile 0
sv_logbans 1
//
//================ INFORMAÇÕES =================
//
sv_contact "IFC Campus Brusque"
echo ""
echo "========================================="
echo " SARC IFC BRUSQUE"
echo " Servidor iniciado com sucesso!"
echo "========================================="
echo ""
